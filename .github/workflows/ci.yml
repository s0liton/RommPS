# Host build and end-to-end test against the mock RomM server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev
      - run: make host tools
      - run: make unit
      - run: tests/e2e.sh
      - run: tests/ps2_e2e.sh
      - run: tests/autostart.sh

  # RommDeck and the Deck's sync service: build, lint, test, package.
  steamdeck:
    uses: ./.github/workflows/steamdeck.yml
    with:
      sha: ${{ github.sha }}
      version: ci
