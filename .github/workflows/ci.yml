# Host build and end-to-end test against the mock RomM server. dev.yml runs it
# too: a dev build that fails it isn't published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev
      - run: make host tools
      - run: make unit
      - run: tests/e2e.sh
      - run: tests/ps2_e2e.sh
      - run: tests/autostart.sh
