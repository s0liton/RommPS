# Builds, tests and packages RommDeck, the Steam Deck app, and RomM Sync for
# the Deck (tools/deck-ci.sh), from the copy s0liton/RommDeck gets
# (tools/rommdeck-copy.sh) rather than from this checkout: RommDeck builds and
# releases from that copy, so a change that breaks it there, or a file the copy
# leaves out, fails here first. Linting is lint.yml's job.
#
# Twice: for the Deck (x86_64), and for ARM handhelds (aarch64) on GitHub's ARM
# machines, so nothing is emulated. The ARM build is a bonus: nobody here has
# such a device, so it may fail without failing the rest.
#
# The packages end up as the artifacts "steamdeck" and "steamdeck-aarch64";
# this workflow never touches a release. ci.yml runs it on pushes and pull
# requests.
name: RommDeck

on:
  workflow_call:
    inputs:
      sha:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "Version baked in and in the file names: 1.5.0 (a leading v is dropped)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            artifact: steamdeck
            bonus: false
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: steamdeck-aarch64
            bonus: true
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.bonus }}
    timeout-minutes: 60
    env:
      COPY: ${{ github.workspace }}/rommdeck
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: rommps

      - name: Copy what RommDeck gets
        id: copy
        run: |
          rommps/tools/rommdeck-copy.sh "$COPY"
          # The image tools/deck-build.sh runs, so the one built below is the one it finds.
          image=$(sed -n 's/^IMAGE="${DECK_IMAGE:-\(.*\)}"$/\1/p' "$COPY/tools/deck-build.sh")
          [ -n "$image" ] || { echo "::error::tools/deck-build.sh names no image"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The cache only saves time, so failing to write it must not fail the build.
      - uses: docker/build-push-action@v6
        with:
          context: rommdeck/platform/steamdeck/app/docker
          tags: ${{ steps.copy.outputs.image }}
          load: true
          # The x86_64 image shares lint.yml's cache; the ARM one has its own.
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }},ignore-error=true

      - name: Build, test and package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          "$COPY/tools/deck-ci.sh" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rommdeck/build/steamdeck/release/
          if-no-files-found: error
